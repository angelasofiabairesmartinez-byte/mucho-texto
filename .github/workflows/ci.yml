# Revisión automática de cada PR. Los dos trabajos deben salir en
# verde para poder hacer merge a develop o main.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: script-completo.sql está al día
        run: node scripts/generar-script-completo.mjs --check
      - name: Crear la BD desde cero (DDL, vistas, funciones, SP, datos) y correr pruebas
        run: |
          cp .env.example .env
          docker compose run --rm -e PRUEBAS=1 db-init
      - name: Registro de SQL Server (si algo falló)
        if: failure()
        run: docker compose logs db | tail -n 150
      - name: Apagar contenedores
        if: always()
        run: docker compose down -v

  aplicacion:
    name: Aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Revisar tipos (API, pantallas y esquemas Zod)
        run: pnpm tipos
      - name: Compilar
        run: pnpm build
